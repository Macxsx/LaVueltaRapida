<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menú - La Vuelta Rápida</title>

  <!-- Bootstrap -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- CSS -->
  <link rel="stylesheet" th:href="@{/styles.css}">
  <link rel="stylesheet" th:href="@{/menu.css}">
</head>

<body>

<div th:replace="fragmentos :: header"></div>

  <!-- ================= HERO ================= -->
  <section class="menu-hero">
    <h1>NUESTRO <span>MENÚ DESTACADO</span></h1>
    <p>Descubre nuestras especialidades</p>
  </section>

  <!-- ================= CONTENIDO ================= -->
  <main class="container my-5">

    <section class="menu-category">
      <h2 class="category-title red">TODAS LAS PIZZAS</h2>

      <div class="menu-grid">

        <!-- 🔥 CARD COMPLETA CLICKEABLE -->
        <a th:each="comida : ${comidas}"
           th:if="${comida.available}"
           th:href="@{'/producto/' + ${comida.id}}"
           class="menu-card-link">

          <div class="menu-card">

            <!-- Imagen -->
            <img th:src="@{${comida.image}}"
                 th:alt="${comida.name}">

            <!-- Nombre -->
            <h4 th:text="${comida.name}"></h4>

            <!-- Descripción -->
            <p th:text="${comida.description}"></p>

            <!-- Footer -->
            <div class="menu-card-footer">
              <span class="price"
                    th:text="${comida.currency} + ' ' + ${#numbers.formatDecimal(comida.price,1,2)}">
              </span>
            </div>

          </div>

        </a>
        <!-- 🔥 FIN CARD -->

      </div>
    </section>

  </main>

 <div th:replace="fragmentos :: footer"></div>

</body>
</html>
