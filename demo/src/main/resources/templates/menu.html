<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menú - La Vuelta Rápida</title>

  <!-- Bootstrap -->
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700&display=swap" rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" th:href="@{/styles.css}">
  <link rel="stylesheet" th:href="@{/menu.css}">
</head>

<body>

<div th:replace="fragmentos :: header"></div>

<!-- ================= HERO ================= -->
<section class="menu-hero">
  <h1>NUESTRO <span>MENÚ</span></h1>
  <p>Descubre nuestras especialidades</p>
</section>

<!-- <p th:text="'Total comidas: ' + ${#lists.size(comidas)}"></p> -->

<!-- ================= CONTENIDO ================= -->
<main class="menu-container my-5">

  <!-- 🔥 ITERAMOS CATEGORÍAS DINÁMICAMENTE -->
  <section th:each="categoria : ${categorias}"
           class="menu-category"
           th:attr="id=${#strings.toLowerCase(categoria.name)}">

    <!-- TÍTULO DINÁMICO -->
    <h2 class="category-title"
        th:text="${#strings.toUpperCase(categoria.name)}"
        th:classappend="${categoria.name == 'Especiales' or categoria.name == 'Bebidas'} ? 'yellow' : 'red'">
    </h2>

    <div class="menu-grid">

      <!-- 🔥 ITERAMOS COMIDAS FILTRADAS -->
      <a th:each="comida : ${comidas}"
         th:if="${comida.available and comida.category.id == categoria.id}"
         th:href="@{'/producto/' + ${comida.id}}"
         class="menu-card-link">

        <div class="menu-card">
          <img th:src="@{${comida.image}}" th:alt="${comida.name}">
          <h4 th:text="${comida.name}"></h4>
          <p th:text="${comida.description}"></p>

          <div class="menu-card-footer">
            <span class="price"
              th:text="'$ ' + ${#numbers.formatDecimal(comida.price, 0, 'POINT', 0, 'POINT')} + ' COP'"></span>
            </span>
          </div>
        </div>

      </a>

    </div>
  </section>

</main>

<div th:replace="fragmentos :: footer"></div>

</body>
</html>
