<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Perfil - La Vuelta Rápida</title>

  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" th:href="@{/styles.css}">
  <link rel="stylesheet" th:href="@{/perfil.css}">
</head>

<body>

<div th:replace="fragmentos :: header"></div>

<!-- ================= HERO ================= -->
<section class="perfil-hero">
  <h1>MI <span>PERFIL</span></h1>
  <p>Administra tu información personal</p>
</section>

<!-- ================= CONTENIDO ================= -->
<section class="perfil-container">

  <div class="perfil-card">

    <!-- ÉXITO -->
    <div th:if="${param.success}" class="perfil-success">
      Datos actualizados correctamente
    </div>

    <!-- ================= MODO VISUALIZACIÓN ================= -->
    <div th:if="${!editMode}" class="perfil-view">

      <div class="perfil-grid">

        <div class="perfil-item">
          <label>Nombre</label>
          <p th:text="${cliente.name}"></p>
        </div>

        <div class="perfil-item">
          <label>Apellido</label>
          <p th:text="${cliente.apellido}"></p>
        </div>

        <div class="perfil-item">
          <label>Email</label>
          <p th:text="${cliente.email}"></p>
        </div>

        <div class="perfil-item">
          <label>Usuario</label>
          <p th:text="${cliente.username}"></p>
        </div>

        <div class="perfil-item">
          <label>Dirección</label>
          <p th:text="${cliente.direccion}"></p>
        </div>

        <div class="perfil-item">
          <label>Teléfono</label>
          <p th:text="${cliente.telefono}"></p>
        </div>

      </div>

      <div class="perfil-actions">

        <a th:href="@{/perfil(edit=true)}" class="btn-primary">
          Editar Información
        </a>

        <form th:action="@{/perfil/delete}" method="post"
              onsubmit="return confirm('¿Seguro que deseas eliminar tu cuenta?');">
          <button type="submit" class="btn-danger">
            Eliminar Cuenta
          </button>
        </form>

      </div>

    </div>

    <!-- ================= MODO EDICIÓN ================= -->
    <form th:if="${editMode}"
          th:action="@{/perfil/update}"
          th:object="${cliente}"
          method="post"
          class="perfil-form">

      <input type="hidden" th:field="*{id}">

      <div class="perfil-grid">

        <div class="form-group">
          <label>Nombre</label>
          <input type="text" th:field="*{name}" required>
        </div>

        <div class="form-group">
          <label>Apellido</label>
          <input type="text" th:field="*{apellido}" required>
        </div>

        <div class="form-group">
          <label>Email</label>
          <input type="email" th:field="*{email}" required>
        </div>

        <div class="form-group">
          <label>Usuario</label>
          <input type="text" th:field="*{username}" readonly>
        </div>

        <div class="form-group">
          <label>Dirección</label>
          <input type="text" th:field="*{direccion}">
        </div>

        <div class="form-group">
          <label>Teléfono</label>
          <input type="text" th:field="*{telefono}">
        </div>

        <div class="form-group full-width">
          <label>Contraseña</label>
          <input type="password" th:field="*{password}" required>
        </div>

      </div>

      <div class="perfil-actions">

        <a th:href="@{/perfil}" class="btn-secondary">
          Cancelar
        </a>

        <button type="submit" class="btn-primary">
          Confirmar Cambios
        </button>

      </div>

    </form>

  </div>

</section>

<div th:replace="fragmentos :: footer"></div>

</body>
</html>
