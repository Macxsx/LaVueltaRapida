<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="'Error ' + ${status} + ' - La Vuelta Rápida'">Error - La Vuelta Rápida</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,700;0,900;1,400;1,700&family=Orbitron:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/styles.css}">
  <link rel="stylesheet" th:href="@{/error.css}">
</head>

<body>

<main>

  <div th:replace="~{fragmentos :: header}"></div>

  <section class="error-section">
    <div class="error-overlay"></div>

    <div class="error-inner">

      <div class="error-flag-lights">
        <span class="flag-light flag-light-1"></span>
        <span class="flag-light flag-light-2"></span>
        <span class="flag-light flag-light-3"></span>
        <span class="flag-light flag-light-4"></span>
        <span class="flag-light flag-light-5"></span>
      </div>

      <div class="error-badge">
        <span class="error-badge-text">BANDERA ROJA</span>
      </div>

      <h1 class="error-code" th:text="${status}" th:attr="data-text=${status}">500</h1>

      <h2 class="error-title">
        <span th:text="${error}">Error interno</span>
      </h2>

      <p class="error-message" th:if="${message != null and message != 'No message available'}" th:text="${message}"></p>

      <p class="error-subtitle">
        La carrera se ha detenido. Algo salió mal en el circuito.
      </p>

      <div class="error-details">
        <div class="error-detail-item">
          <span class="error-detail-label">CÓDIGO</span>
          <span class="error-detail-value" th:text="${status}">500</span>
        </div>
        <div class="error-detail-divider"></div>
        <div class="error-detail-item">
          <span class="error-detail-label">TIPO</span>
          <span class="error-detail-value" th:text="${error}">Internal Server Error</span>
        </div>
        <div class="error-detail-divider"></div>
        <div class="error-detail-item">
          <span class="error-detail-label">RUTA</span>
          <span class="error-detail-value" th:text="${path}">/</span>
        </div>
      </div>

      <div class="error-actions">
        <a th:href="@{/}" class="btn-error-primary">
          VOLVER AL INICIO
        </a>
        <a th:href="@{/producto/menu}" class="btn-error-secondary">
          VER EL MENÚ
        </a>
      </div>

    </div>
  </section>

  <div th:replace="~{fragmentos :: footer}"></div>

</main>

</body>
</html>
