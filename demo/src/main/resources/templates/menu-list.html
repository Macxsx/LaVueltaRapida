<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Menú Lista | La Vuelta Rápida</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700&display=swap" rel="stylesheet">
  
  <!-- Global -->
  <link rel="stylesheet" th:href="@{/styles.css}">

  <!-- Page -->
  <link rel="stylesheet" th:href="@{/menu-list.css}">
</head>

<body>

<div th:replace="fragmentos :: header"></div>

<!-- ================= HERO ================= -->
<section class="menu-hero">
  <div class="container">
    <h1>NUESTRO <span>MENÚ COMPLETO</span></h1>
    <p>Saborea una carrera llena de emoción</p>
  </div>

      <div class="hero-action">
      <a th:href="@{/producto/add}" class="btn-add-hero">
        + Agregar Producto
      </a>
    </div>

    
</section>


<!-- ================= TABLA POR CATEGORÍAS ================= -->
<section class="menu-list-section">
  <div class="container">

    <!-- 🔥 ITERAMOS CATEGORÍAS -->
    <div th:each="categoria : ${categorias}">

      <!-- TÍTULO DINÁMICO -->
      <h2 class="list-category"
          th:text="${categoria.name}"
          th:classappend="${categoria.name == 'Especiales' or categoria.name == 'Bebidas'} ? 'yellow' : 'red'">
      </h2>

      <div class="table-responsive">
        <table class="menu-table">
          <tbody>

            <!-- 🔥 ITERAMOS COMIDAS FILTRADAS POR CATEGORÍA -->
            <tr th:each="comida : ${comidas}"
                th:if="${comida.available and comida.category.id == categoria.id}"
                th:onclick="'window.location.href=\'/producto/' + ${comida.id} + '\''"
                class="clickable-row">

              <td>
                <img th:src="@{${comida.image}}"
                     th:alt="${comida.name}"
                     class="table-img">
              </td>

              <td>
                <strong th:text="${comida.name}"></strong><br>
                <span class="desc" th:text="${comida.description}"></span>
              </td>

              <td class="price-cell"
                  th:text="${comida.currency} + ' ' + ${#numbers.formatDecimal(comida.price,1,2)}">
              </td>

              <td class="actions-cell" onclick="event.stopPropagation();">
                <div class="actions-wrapper">
                  <a th:href="@{/producto/update/{id}(id=${comida.id})}"
                    class="btn-edit">
                    Modificar
                  </a>

                  <a th:href="@{/producto/delete/{id}(id=${comida.id})}"
                    class="btn-delete"
                    onclick="return confirm('¿Seguro que quieres eliminar este producto?');">
                    Eliminar
                  </a>
                </div>
              </td>

            </tr>

          </tbody>
        </table>
      </div>

    </div>

  </div>
</section>

<div th:replace="fragmentos :: footer"></div>

</body>
</html>
