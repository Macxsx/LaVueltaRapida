<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Menú Lista | La Vuelta Rápida</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- Global -->
  <link rel="stylesheet" th:href="@{/styles.css}">

  <!-- Page -->
  <link rel="stylesheet" th:href="@{/menu-list.css}">
</head>

<body>

<div th:replace="fragmentos :: header"></div>

<!-- ================= HERO ================= -->
<section class="menu-hero">
  <div class="container">
    <h1>NUESTRO <span>MENÚ COMPLETO</span></h1>
    <p>Saborea una carrera llena de emoción</p>
  </div>
</section>

<!-- ================= TABLA ================= -->
<section class="menu-list-section">
  <div class="container">

    <h2>Todas las Pizzas</h2>

    <div class="table-responsive">
      <table class="menu-table">

        <thead>
          <tr>
            <th>Imagen</th>
            <th>Nombre</th>
            <th>Descripción</th>
            <th>Precio</th>
            <th></th>
          </tr>
        </thead>

        <tbody>

          <tr th:each="comida : ${comidas}"
              th:if="${comida.available}"
              th:onclick="'window.location.href=\'/producto/' + ${comida.id} + '\''"
              class="clickable-row">

            <td>
              <img th:src="@{${comida.image}}"
                   th:alt="${comida.name}"
                   class="table-img">
            </td>

            <td th:text="${comida.name}"></td>

            <td th:text="${comida.description}"></td>

            <td th:text="${comida.currency} + ' ' + ${#numbers.formatDecimal(comida.price,1,2)}"></td>

            <td>
              <form th:action="@{/carrito/agregar}" method="post"
                    onclick="event.stopPropagation();">
                <input type="hidden" name="id" th:value="${comida.id}">
                <button type="submit" class="btn-order-small">
                  Agregar
                </button>
              </form>
            </td>

          </tr>

        </tbody>

      </table>
    </div>

  </div>
</section>


<div th:replace="fragmentos :: footer"></div>


</body>
</html>
