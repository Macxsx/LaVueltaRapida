<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión - La Vuelta Rápida</title>

  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" th:href="@{/styles.css}">
  <link rel="stylesheet" th:href="@{/login.css}">
</head>

<body>
  
<div th:replace="fragmentos :: header"></div>

<section class="login-hero">
  <h1>INICIAR <span>SESIÓN</span></h1>
  <p>Accede a tu cuenta y vive la experiencia</p>
</section>

<main class="login-container">
  <div class="login-card">

    <div class="login-header">
      <div class="login-header-accent"></div>
      <div class="login-icon">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#e10600" stroke-width="1.5">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
      </div>
      <h2>BIENVENIDO</h2>
      <p>Ingresa tus credenciales para continuar</p>
    </div>

    <div th:if="${param.error}" class="login-error">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"/>
        <line x1="15" y1="9" x2="9" y2="15"/>
        <line x1="9" y1="9" x2="15" y2="15"/>
      </svg>
      <span>Usuario o contraseña incorrectos</span>
    </div>

    <form th:action="@{/login}" method="post" class="login-form">

      <div class="form-group">
        <label for="username">Usuario</label>
        <div class="input-icon-wrapper">
          <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#555" stroke-width="1.5">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
          <input type="text" id="username" name="username" placeholder="Ingresa tu usuario" required autofocus>
        </div>
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <div class="input-icon-wrapper">
          <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#555" stroke-width="1.5">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
          <input type="password" id="password" name="password" placeholder="Ingresa tu contraseña" required>
        </div>
      </div>

      <button type="submit" class="btn-login">INICIAR SESIÓN</button>

      <div class="login-footer">
        <p>¿No tienes cuenta? <a th:href="@{/register}">Regístrate aquí</a></p>
        <p>¿Olvidaste tu contraseña? <a th:href="@{/recuperar}">Recuperala aquí</a></p>
      </div>

    </form>

  </div>
</main>

<div th:replace="fragmentos :: footer"></div>

</body>
</html>
