<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agregar Producto - La Vuelta Rápida</title>

  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" th:href="@{/styles.css}">
  <link rel="stylesheet" th:href="@{/add-product.css}">
</head>

<body>

<div th:replace="~{fragmentos :: header}"></div>

<section class="add-hero">
  <h1>AGREGAR <span>PRODUCTO</span></h1>
  <p>Suma un nuevo plato a la parrilla de salida</p>
</section>

<main class="add-container">
  <div class="form-card">

    <div class="form-header">
      <div class="form-header-accent"></div>
      <h2>NUEVO PRODUCTO</h2>
      <p>Completa los datos del producto que deseas agregar al menú</p>
    </div>

    <form th:action="@{/producto/add}" th:object="${comida}" method="post" class="product-form">

      <div class="form-grid">

        <div class="form-group full-width">
          <label for="name">Nombre del producto</label>
          <input type="text" id="name" th:field="*{name}" placeholder="Ej: Pizza Turbo Trufa" required>
        </div>

        <div class="form-group full-width">
          <label for="description">Descripción</label>
          <textarea id="description" th:field="*{description}" rows="3"
                    placeholder="Describe los ingredientes y características del producto" required></textarea>
        </div>

        <div class="form-group">
          <label for="price">Precio</label>
          <div class="input-with-prefix">
            <span class="input-prefix">COP</span>
            <input type="number" id="price" th:field="*{price}" step="100" min="0"
                   placeholder="0.00" required>
          </div>
        </div>

        <div class="form-group">
          <label for="categoryId">Categoría</label>
          <select id="categoryId" name="categoryId" required>
            <option value="" disabled selected>Selecciona una categoría</option>
            <option th:each="cat : ${categorias}"
                    th:value="${cat.id}"
                    th:text="${cat.name}"></option>
          </select>
        </div>

      </div>

      <div class="image-row">
        <div class="image-url-col">
          <div class="form-group">
            <label for="image">URL de la imagen</label>
            <input type="url" id="image" th:field="*{image}"
                   placeholder="https://ejemplo.com/imagen.jpg" required>
          </div>
        </div>
        <div class="image-preview-col">
          <div class="form-preview" id="imagePreview">
            <div class="preview-placeholder">
              <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#555" stroke-width="1.5">
                <rect x="3" y="3" width="18" height="18" rx="2"/>
                <circle cx="8.5" cy="8.5" r="1.5"/>
                <path d="M21 15l-5-5L5 21"/>
              </svg>
              <span>Vista previa</span>
            </div>
            <img id="previewImg" src="" alt="Vista previa" style="display:none;">
          </div>
        </div>
      </div>

      <div class="form-group full-width">
        <label class="toggle-label">Disponibilidad</label>
        <div class="form-check form-switch mt-2">
          <input class="form-check-input" type="checkbox" role="switch"
                 th:field="*{available}" id="availableToggle">
          <label class="form-check-label" for="availableToggle" id="toggleText"
                 th:text="${comida.available} ? 'Disponible en el menú' : 'No disponible'">
          </label>
        </div>
      </div>

      <div class="form-actions">
        <a th:href="@{/producto/menutabla}" class="btn-cancel">CANCELAR</a>
        <button type="submit" class="btn-submit">
          AGREGAR AL MENÚ
        </button>
      </div>

    </form>

  </div>
</main>

<div th:replace="~{fragmentos :: footer}"></div>

<script>
  const imageInput = document.getElementById('image');
  const previewImg = document.getElementById('previewImg');
  const placeholder = document.querySelector('.preview-placeholder');

  imageInput.addEventListener('input', function () {
    const url = this.value.trim();
    if (url) {
      previewImg.src = url;
      previewImg.style.display = 'block';
      placeholder.style.display = 'none';
      previewImg.onerror = function () {
        previewImg.style.display = 'none';
        placeholder.style.display = 'flex';
      };
    } else {
      previewImg.style.display = 'none';
      placeholder.style.display = 'flex';
    }
  });

  const toggle = document.getElementById('availableToggle');
  const toggleText = document.getElementById('toggleText');

  function updateToggleState() {
    if (toggle.checked) {
      toggleText.textContent = 'Disponible en el menú';
    } else {
      toggleText.textContent = 'No disponible';
    }
  }

  toggle.addEventListener('change', updateToggleState);
  updateToggleState();
</script>

</body>
</html>
