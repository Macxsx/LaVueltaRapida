<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <title th:text="${comida.name} + ' | La Vuelta Rápida'">Detalle Producto</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/styles.css}">
  <link rel="stylesheet" th:href="@{/product.css}">
</head>

<body>

  <div th:replace="fragmentos :: header"></div>

  <main class="pd-main">

    <section class="pd-hero">

      <!-- TOP ROW: info left | price right -->
      <div class="pd-top">
        <div class="pd-info-left">
          <div class="pd-meta">
            <span class="pd-badge" th:text="${comida.category.name}">Categoría</span>
            <span class="pd-availability"
                  th:classappend="${comida.available} ? 'pd-avail--on' : 'pd-avail--off'"
                  th:text="${comida.available} ? '● DISPONIBLE' : '● AGOTADO'">DISPONIBLE</span>
          </div>
          <h1 class="pd-title" th:text="${comida.name}">Nombre del Producto</h1>
          <p class="pd-description" th:text="${comida.description}">Descripción.</p>
        </div>

        <div class="pd-price-right">
          <div class="pd-price-block">
            <div class="pd-price-label">PRECIO BASE</div>
            <div class="pd-price" th:text="'$ ' + ${#numbers.formatDecimal(comida.price, 0, 'POINT', 0, 'POINT')} + ' COP'">$ 0 COP</div>
          </div>
        </div>
      </div>

      <!-- BOTTOM ROW: image left | options right -->
      <div class="pd-bottom">

        <!-- IMAGE -->
        <div class="pd-image-wrap">
          <div class="pd-image-frame">
            <img th:src="@{${comida.image}}" th:alt="${comida.name}" class="pd-image">
            <div class="pd-image-overlay"></div>
          </div>
          <div class="pd-corner pd-corner--tl"></div>
          <div class="pd-corner pd-corner--tr"></div>
          <div class="pd-corner pd-corner--bl"></div>
          <div class="pd-corner pd-corner--br"></div>
        </div>

        <!-- OPTIONS + BUTTON -->
        <div class="pd-options-panel">
          <form th:action="@{/carrito/agregar}" method="post" class="pd-form add-to-cart-form">
            <input type="hidden" name="id" th:value="${comida.id}">
            <input type="hidden" id="base-price" th:value="${comida.price}">

            <div class="pd-options" th:if="${!#lists.isEmpty(comida.category.adicionales)}">
              <h4 class="pd-options-title">
                <span class="pd-options-icon">⚙</span>
                Personaliza tu pedido
              </h4>
              <div class="pd-options-grid">
                <div class="pd-option-item"
                     th:each="adicional : ${comida.category.adicionales}"
                     th:if="${adicional.available}">
                  <input type="checkbox"
                         th:id="'adic-' + ${adicional.id}"
                         name="adicionales"
                         th:value="${adicional.id}"
                         th:data-price="${adicional.price}"
                         class="pd-checkbox">
                  <label th:for="'adic-' + ${adicional.id}" class="pd-option-label">
                    <span class="pd-option-name" th:text="${adicional.name}">Adicional</span>
                    <span class="pd-option-price"
                          th:text="'+$ ' + ${#numbers.formatDecimal(adicional.price,0,'POINT',0,'POINT')}">+$ 0</span>
                  </label>
                </div>
              </div>
            </div>

            <div class="pd-divider"></div>

            <button type="submit" class="pd-btn-order" id="btn-order">
              <svg class="f1-cart-icon" viewBox="0 0 38 20" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                <!-- Alerón trasero sólido -->
                <rect x="3" y="1" width="2" height="6" rx="1"/>
                <rect x="1" y="1" width="6" height="2.5" rx="1.2"/>
                <!-- Cuerpo: solo contorno (malla de alambre) -->
                <path d="M4 8 L7 6 L27 6 L32 7.5 L32 10 L27 11 L7 11 L4 10 Z"
                      fill="none" stroke="currentColor" stroke-width="1.1"/>
                <!-- Malla horizontal -->
                <line x1="7.5" y1="8" x2="30" y2="8" stroke="currentColor" stroke-width="0.5" opacity="0.75"/>
                <line x1="6.5" y1="9.5" x2="31" y2="9.5" stroke="currentColor" stroke-width="0.5" opacity="0.75"/>
                <!-- Malla vertical -->
                <line x1="10" y1="6.2" x2="10" y2="10.8" stroke="currentColor" stroke-width="0.5" opacity="0.75"/>
                <line x1="14" y1="6" x2="14" y2="11" stroke="currentColor" stroke-width="0.5" opacity="0.75"/>
                <line x1="18" y1="6" x2="18" y2="11" stroke="currentColor" stroke-width="0.5" opacity="0.75"/>
                <line x1="22" y1="6" x2="22" y2="11" stroke="currentColor" stroke-width="0.5" opacity="0.75"/>
                <line x1="26" y1="6.2" x2="26" y2="10.8" stroke="currentColor" stroke-width="0.5" opacity="0.75"/>
                <!-- Cono de nariz sólido -->
                <path d="M30 7.5 L37 8.5 L30 10 Z"/>
                <!-- Halo -->
                <rect x="14" y="4.5" width="9" height="2" rx="1" opacity="0.55"/>
                <!-- Rueda trasera estilo caster de carrito -->
                <circle cx="9" cy="13.5" r="4.5" fill="none" stroke="currentColor" stroke-width="1.3"/>
                <circle cx="9" cy="13.5" r="2.2"/>
                <circle cx="9" cy="13.5" r="0.9" fill="rgba(0,0,0,0.5)"/>
                <!-- Rueda delantera estilo caster de carrito -->
                <circle cx="25" cy="13.5" r="3.8" fill="none" stroke="currentColor" stroke-width="1.2"/>
                <circle cx="25" cy="13.5" r="1.8"/>
                <circle cx="25" cy="13.5" r="0.7" fill="rgba(0,0,0,0.5)"/>
              </svg>
              <span class="btn-label">AGREGAR AL CARRITO</span>
              <span class="btn-total" id="btn-total"
                    th:text="'$ ' + ${#numbers.formatDecimal(comida.price, 0, 'POINT', 0, 'POINT')} + ' COP'">$ 0 COP</span>
            </button>
          </form>
        </div>

      </div>
    </section>

    <!-- RECOMMENDATIONS -->
    <section class="pd-recs-section" th:if="${!#lists.isEmpty(recomendaciones)}">
      <div class="pd-recs-inner">
        <div class="pd-recs-header">
          <div class="pd-recs-line"></div>
          <h3 class="pd-recs-title">También te puede interesar</h3>
          <div class="pd-recs-line"></div>
        </div>
        <div class="pd-recs-grid">
          <a class="pd-rec-card"
             th:each="rec : ${recomendaciones}"
             th:if="${rec.available}"
             th:href="@{'/producto/' + ${rec.id}}">
            <div class="pd-rec-img-wrap">
              <img th:src="@{${rec.image}}" th:alt="${rec.name}" class="pd-rec-img">
              <div class="pd-rec-overlay"><span>Ver producto</span></div>
            </div>
            <div class="pd-rec-body">
              <p class="pd-rec-name" th:text="${rec.name}">Nombre</p>
              <span class="pd-rec-price"
                    th:text="'$ ' + ${#numbers.formatDecimal(rec.price, 0, 'POINT', 0, 'POINT')} + ' COP'">Precio</span>
            </div>
          </a>
        </div>
      </div>
    </section>

  </main>

  <div th:replace="fragmentos :: footer"></div>
  <div id="toast" class="toast-notification">✔ Producto agregado al carrito</div>
  <script th:src="@{/product-detail.js}"></script>
</body>
</html>
