
#---
spring.config.activate.on-profile=default
spring.application.name=LaVueltaRapida
server.port=8090

# Consola de administración (Acceso: localhost:5000/h2)
spring.h2.console.enabled=true
spring.h2.console.path=/h2
spring.h2.console.settings.web-allow-others=true

# Datasource en MEMORIA
spring.datasource.url=jdbc:h2:mem:lavueltarapida
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Configuración JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Logging para ver las "Telemetrías" (Queries)
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Mercado Pago Checkout Pro
mercadopago.access-token=${MERCADOPAGO_ACCESS_TOKEN:}
mercadopago.public-key=${MERCADOPAGO_PUBLIC_KEY:}
mercadopago.webhook-secret=${MERCADOPAGO_WEBHOOK_SECRET:}
app.frontend-url=${APP_FRONTEND_URL:https://hg6k75cd-4200.use2.devtunnels.ms}
app.backend-url=${APP_BACKEND_URL:}

