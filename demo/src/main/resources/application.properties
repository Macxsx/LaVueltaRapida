
#---
spring.config.activate.on-profile=default
spring.application.name=LaVueltaRapida
server.port=${PORT:8090}

# Consola de administración (Acceso: localhost:8090/h2)
spring.h2.console.enabled=true
spring.h2.console.path=/h2
spring.h2.console.settings.web-allow-others=true

# Datasource en MEMORIA
spring.datasource.url=jdbc:h2:mem:lavueltarapida
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Configuración JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Logging para ver las "Telemetrías" (Queries)
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Mercado Pago Checkout Pro
mercadopago.access-token=${MERCADOPAGO_ACCESS_TOKEN:}
mercadopago.public-key=${MERCADOPAGO_PUBLIC_KEY:}
mercadopago.webhook-secret=${MERCADOPAGO_WEBHOOK_SECRET:}
app.frontend-url=${APP_FRONTEND_URL:https://hg6k75cd-4200.use2.devtunnels.ms}
app.backend-url=${APP_BACKEND_URL:}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200,https://*.devtunnels.ms,https://*.replit.dev,https://*.repl.co,https://lavueltarapida.com,https://www.lavueltarapida.com,https://lavueltarapida.org,https://www.lavueltarapida.org,https://lavueltarapida.online,https://www.lavueltarapida.online,https://lavueltarapida.store,https://www.lavueltarapida.store}

# JWT
app.jwt.secret=${JWT_SECRET:laVueltaRapidaSecretKeyJWT2024Segura!!}
app.jwt.expiration=${JWT_EXPIRATION:86400000}

# Correo (SMTP)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_USERNAME:}


